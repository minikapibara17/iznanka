
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ИЗНАНКА | TERMINAL 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Benguiat:wght@700&family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0800;
    --deep: #050400;
    --red: #cc1111;
    --red-glow: rgba(204, 17, 17, 0.5);
    --red-hot: #ff2222;
    --amber: #e8960a;
    --amber-dim: #7a4e05;
    --cream: #f0e8d0;
    --dim: #8a7a5a;
    --panel: rgba(12, 8, 0, 0.95);
    --border: #3a2800;
    --border-red: #550a0a;
    --vine: #1a2a0a;
    --vine-bright: #2d4a12;
    --flicker-dur: 0.08s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep);
    color: var(--cream);
    font-family: 'Special Elite', serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    cursor: crosshair;
  }

  .scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px);
  }
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%);
  }
  .static-noise {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 6; pointer-events: none; opacity: 0.025;
    animation: noiseAnim 0.15s steps(1) infinite;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }
  @keyframes noiseAnim {
    0%   { background-position: 0 0; }
    25%  { background-position: -50px 30px; }
    50%  { background-position: 30px -20px; }
    75%  { background-position: -20px 50px; }
    100% { background-position: 50px -30px; }
  }
  .spores { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
  .spore {
    position: absolute; border-radius: 50%; opacity: 0;
    animation: floatSpore linear infinite;
  }
  @keyframes floatSpore {
    0%   { transform: translate(0, 110vh) scale(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translate(var(--drift), -10vh) scale(1); opacity: 0; }
  }
  #app {
    max-width: 500px; margin: 0 auto;
    display: flex; flex-direction: column;
    position: relative; z-index: 10; min-height: 100vh;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .header {
    padding: 40px 20px 20px;
    background: linear-gradient(180deg, #0d0900 0%, #080600 100%);
    border-bottom: 2px solid var(--border-red);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(204,17,17,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .timer-box {
    font-family: 'VT323', monospace; font-size: 28px;
    color: var(--amber); letter-spacing: 4px;
    text-shadow: 0 0 8px var(--amber), 0 0 20px rgba(232,150,10,0.4);
    margin-bottom: 12px;
    animation: ambFlicker 4s ease-in-out infinite;
  }
  @keyframes ambFlicker {
    0%,100% { opacity: 1; text-shadow: 0 0 8px var(--amber), 0 0 20px rgba(232,150,10,0.4); }
    92% { opacity: 1; }
    93% { opacity: 0.6; text-shadow: none; }
    94% { opacity: 1; text-shadow: 0 0 8px var(--amber), 0 0 20px rgba(232,150,10,0.4); }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 1; }
  }
  .sigil-wrap {
    width: 70px; height: 70px; margin: 0 auto 8px;
    position: relative;
  }
  .sigil-ring {
    position: absolute; inset: 0;
    border: 1.5px solid var(--border-red);
    border-radius: 50%;
    animation: sigilRotate 8s linear infinite;
  }
  .sigil-ring:nth-child(2) {
    inset: 8px;
    border-color: rgba(204,17,17,0.5);
    animation-duration: 5s; animation-direction: reverse;
  }
  .sigil-inner {
    position: absolute; inset: 16px;
    background: radial-gradient(circle, #1a0000 0%, #050000 100%);
    border: 1px solid var(--border-red); border-radius: 50%;
    overflow: hidden;
  }
  .sigil-sweep {
    position: absolute; inset: 0;
    background: conic-gradient(from 0deg, transparent 85%, rgba(204,17,17,0.7) 90%, transparent 100%);
    animation: sigilRotate 3s linear infinite;
    border-radius: 50%;
  }
  @keyframes sigilRotate { to { transform: rotate(360deg); } }
  .setup {
    padding: 50px 25px;
    display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, #080600 0%, #0a0900 100%);
    flex: 1;
  }
  .main-title {
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 56px; letter-spacing: 14px;
    color: var(--red-hot);
    text-shadow: 0 0 10px var(--red-hot), 0 0 30px rgba(204,17,17,0.6), 0 0 60px rgba(204,17,17,0.3), 2px 2px 0 #1a0000;
    margin-bottom: 8px;
    animation: titleFlicker 6s ease-in-out infinite;
    text-transform: uppercase;
  }
  @keyframes titleFlicker {
    0%,100% { opacity: 1; }
    48% { opacity: 1; }
    50% { opacity: 0.85; text-shadow: 0 0 6px var(--red-hot); }
    52% { opacity: 1; text-shadow: 0 0 10px var(--red-hot), 0 0 30px rgba(204,17,17,0.6), 0 0 60px rgba(204,17,17,0.3), 2px 2px 0 #1a0000; }
    78% { opacity: 1; }
    79% { opacity: 0.7; }
    80% { opacity: 1; }
  }
  .subtitle {
    font-family: 'VT323', monospace; font-size: 15px;
    color: var(--dim); letter-spacing: 6px;
    margin-bottom: 50px; text-transform: uppercase;
  }
  .divider {
    width: 100%; border: none; border-top: 1px solid var(--border);
    margin: 10px 0 40px; position: relative;
  }
  .divider::after {
    content: '✦';
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #090700; padding: 0 10px; color: var(--border-red); font-size: 12px;
  }
  .choose-label {
    font-family: 'VT323', monospace; font-size: 13px;
    color: var(--amber-dim); letter-spacing: 4px; margin-bottom: 20px;
    text-transform: uppercase;
  }
  .btn-choice {
    width: 100%; padding: 22px 25px; margin-bottom: 16px;
    background: transparent;
    border: 1px solid var(--border-red);
    color: var(--cream);
    font-family: 'Special Elite', serif; font-size: 15px;
    cursor: pointer; transition: all 0.25s ease;
    text-transform: uppercase; letter-spacing: 3px;
    position: relative; overflow: hidden;
    text-align: left;
  }
  .btn-choice::before {
    content: '▶';
    color: var(--red); margin-right: 14px;
    font-size: 10px; vertical-align: middle;
    transition: transform 0.2s, color 0.2s;
    display: inline-block;
  }
  .btn-choice::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 0; background: rgba(204,17,17,0.08);
    transition: height 0.25s ease;
    z-index: 0;
  }
  .btn-choice:hover {
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 0 20px rgba(204,17,17,0.2), inset 0 0 20px rgba(204,17,17,0.05);
  }
  .btn-choice:hover::before { transform: translateX(4px); color: var(--red-hot); }
  .btn-choice:hover::after { height: 100%; }
  #chatScreen { flex: 1; display: flex; flex-direction: column; }
  .chat-wrap {
    flex: 1; padding: 16px 16px 140px;
    display: flex; flex-direction: column; gap: 20px;
    background: linear-gradient(180deg, #0a0800 0%, #080600 100%);
  }
  .msg-bubble {
    padding: 16px 18px;
    background: rgba(10, 6, 0, 0.92);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-red);
    font-size: 15px; line-height: 1.65;
    position: relative;
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
    animation: msgReveal 0.4s ease-out both;
  }
  @keyframes msgReveal {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-bubble::before {
    content: '';
    position: absolute; top: -1px; left: -3px;
    width: 3px; height: 40%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red-glow);
  }
  .msg-bubble.sys-msg {
    border-left-color: var(--amber-dim);
    background: rgba(12, 8, 0, 0.95);
  }
  .msg-bubble.sys-msg::before { background: var(--amber); box-shadow: 0 0 6px rgba(232,150,10,0.5); }
  .msg-bubble.hero-msg {
    border-left-color: var(--red);
    background: rgba(14, 3, 3, 0.95);
  }
  .msg.user .msg-bubble {
    border-left: 1px solid var(--border);
    border-right: 3px solid var(--border-red);
    border-left-color: var(--border);
    align-self: flex-end;
    background: rgba(5, 3, 0, 0.8);
  }
  .msg.user .msg-bubble::before { display: none; }
  .msg.user .msg-bubble::after {
    content: '';
    position: absolute; top: -1px; right: -3px;
    width: 3px; height: 40%;
    background: var(--border-red);
  }
  .char-tag {
    font-family: 'VT323', monospace; font-size: 13px;
    color: var(--red); letter-spacing: 3px;
    margin-bottom: 8px; display: block;
    text-transform: uppercase;
    text-shadow: 0 0 6px var(--red-glow);
  }
  .char-tag-sys {
    font-family: 'VT323', monospace; font-size: 13px;
    color: var(--amber); letter-spacing: 3px;
    margin-bottom: 8px; display: block;
    text-transform: uppercase;
    text-shadow: 0 0 6px rgba(232,150,10,0.4);
  }
  .char-tag-user {
    font-family: 'VT323', monospace; font-size: 13px;
    color: var(--dim); letter-spacing: 3px;
    margin-bottom: 8px; display: block; text-align: right;
    text-transform: uppercase;
  }
  .typing-cursor::after {
    content: '█';
    color: var(--amber);
    animation: cursorBlink 0.7s steps(1) infinite;
  }
  @keyframes cursorBlink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
  .input-area {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 500px;
    background: #080600;
    border-top: 2px solid var(--border-red);
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.8), 0 -1px 0 rgba(204,17,17,0.1);
  }
  .input-row {
    display: flex; gap: 0; padding: 16px;
  }
  .input-label {
    font-family: 'VT323', monospace; font-size: 11px;
    color: var(--dim); letter-spacing: 2px;
    padding: 0 16px 8px; text-transform: uppercase;
  }
  input {
    flex: 1;
    background: #0d0900;
    border: 1px solid var(--border);
    border-right: none;
    color: var(--cream);
    padding: 14px 16px;
    outline: none;
    font-family: 'VT323', monospace;
    font-size: 18px; letter-spacing: 1px;
    text-transform: uppercase;
    caret-color: var(--amber);
    transition: border-color 0.2s;
  }
  input::placeholder { color: #3a2c1a; }
  input:focus { border-color: var(--border-red); }
  .send-btn {
    background: var(--border-red);
    border: 1px solid var(--red);
    border-left: none;
    color: var(--cream);
    padding: 0 20px;
    font-family: 'VT323', monospace; font-size: 16px;
    cursor: pointer; letter-spacing: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .send-btn:hover {
    background: var(--red);
    box-shadow: 0 0 15px rgba(204,17,17,0.4);
  }
  .xmas-lights {
    position: absolute; top: 0; left: 0; right: 0; height: 26px;
    display: flex; align-items: flex-end; justify-content: space-around;
    padding: 0 8px; z-index: 10;
  }
  .light-unit { display: flex; flex-direction: column; align-items: center; }
  .light-cord { width: 1px; height: 8px; background: #2a2a2a; }
  .light-bulb {
    width: 7px; height: 10px;
    border-radius: 2px 2px 50% 50%;
    position: relative;
    filter: blur(0.3px);
    box-shadow: 0 0 4px currentColor, 0 0 10px currentColor;
  }
  .light-bulb::before {
    content: ''; position: absolute; top: -3px; left: 50%;
    transform: translateX(-50%); width: 5px; height: 3px;
    background: #333; border-radius: 1px;
  }
  .string-line {
    position: absolute; top: 2px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #222, #222, transparent);
    z-index: 9;
  }
  .hidden { display: none !important; }
  .grain {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 7; pointer-events: none; opacity: 0.04;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwBAMAAAClLOS0AAAAElBMVEUAAAD8/vz08vT09PT8+vz49vQ/Zi1NAAAAB3RSTlMAECAwQGCAkfm0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAMklEQVQ4jWNgYGBgJIMCBgYGBiIMYGBgwIAAFCAQgRAIQSAGIhCIQSAGIhCIQSAGAA4MAAtxBJkAAAAASUVORK5CYII=");
    animation: grainMove 0.5s steps(1) infinite;
  }
  @keyframes grainMove {
    0%  { background-position: 0 0; }
    20% { background-position: -30px 20px; }
    40% { background-position: 20px -30px; }
    60% { background-position: -10px 30px; }
    80% { background-position: 30px -10px; }
  }
  @keyframes finalFlash {
    0%   { background: rgba(204,17,17,0.0); }
    50%  { background: rgba(204,17,17,0.15); }
    100% { background: rgba(204,17,17,0.0); }
  }
  .final-flash { animation: finalFlash 1s ease-in-out 3; }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="static-noise"></div>
<div class="grain"></div>
<div class="spores" id="spores"></div>

<div id="app">
  <div class="header">
    <div class="string-line"></div>
    <div class="xmas-lights" id="xmasLights"></div>
    <div style="margin-top:30px;">
      <div class="timer-box" id="timer">00:00</div>
      <div class="sigil-wrap" id="sigil">
        <div class="sigil-ring"></div>
        <div class="sigil-ring"></div>
        <div class="sigil-inner"><div class="sigil-sweep"></div></div>
      </div>
    </div>
  </div>

  <div id="setupScreen" class="setup">
    <h1 class="main-title">ИЗНАНКА</h1>
    <p class="subtitle">TERMINAL&nbsp;2.0</p>
    <hr class="divider">
    <p class="choose-label">// выберите отряд //</p>
    <button class="btn-choice" onclick="startQuest('ivan')"><span>ОТРЯД ЦАРЕВИЧА</span></button>
    <button class="btn-choice" onclick="startQuest('zabava')"><span>ОТРЯД ЗАБАВЫ</span></button>
  </div>

  <div id="chatScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;">
    <div class="chat-wrap" id="messages"></div>
    <div class="input-area">
      <div class="input-label">// ввод данных //</div>
      <div class="input-row">
        <input type="text" id="userInput" placeholder="ВВОД КООРДИНАТ..." autocomplete="off">
        <button class="send-btn" onclick="handleSend()">ВВОД</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CHRISTMAS LIGHTS ───
const lightColors = ['#ff2222','#ff8800','#22cc22','#2288ff','#ffee00','#cc22cc','#ff4488'];
const lightsEl = document.getElementById('xmasLights');
for (let i = 0; i < 28; i++) {
  const c = lightColors[i % lightColors.length];
  const unit = document.createElement('div');
  unit.className = 'light-unit';
  unit.innerHTML = `<div class="light-cord"></div><div class="light-bulb" style="color:${c};background:${c};"></div>`;
  lightsEl.appendChild(unit);
  const bulb = unit.querySelector('.light-bulb');
  const delay = Math.random() * 4;
  const dur = 0.5 + Math.random() * 4;
  bulb.style.animation = `bulbFlicker ${dur}s ${delay}s ease-in-out infinite`;
}
const styleEl = document.createElement('style');
styleEl.textContent = `@keyframes bulbFlicker { 0%,100% { opacity:1; } 50% { opacity:0.3; box-shadow: none; } 55% { opacity:1; box-shadow: 0 0 4px currentColor, 0 0 10px currentColor; } }`;
document.head.appendChild(styleEl);

// ─── SPORES ───
const sporesEl = document.getElementById('spores');
for (let i = 0; i < 22; i++) {
  const s = document.createElement('div');
  s.className = 'spore';
  s.style.width = (Math.random() * 3 + 1) + 'px';
  s.style.height = s.style.width;
  s.style.left = (Math.random() * 100) + 'vw';
  s.style.bottom = '-5px';
  s.style.background = ['rgba(204,17,17,0.5)','rgba(232,150,10,0.4)','rgba(255,255,255,0.2)'][Math.floor(Math.random()*3)];
  s.style.animationDuration = (Math.random() * 8 + 6) + 's';
  s.style.animationDelay = (Math.random() * 8) + 's';
  s.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
  sporesEl.appendChild(s);
}

// ─── GAME STATE ───
let startTime, timerIdx, step = 0, team = '', awaitingArrival = true, finalStage = 0;

// Новые структуры сообщений: разделено на "жалоба" и "задание"
const heroMessages = {
  yaga: {
    distress: "Кха-кха... Слышите этот треск? Это Изнанка пожирает мою избушку! Связь с реальным миром почти пропала — только старое радио ещё ловит сигнал сквозь помехи. Мне не выбраться без моей ступы. Она спрятана где-то в заповеднике.",
    task: "Найдите её!\n\nНо есть зарок: к ступе может подойти только половина отряда. Вы телом и жестами должны показать другой половине координаты. Лишь те, кто увидят символы, смогут ввести их. На ступе будут координаты — только они помогут мне отыскать дорогу обратно. Скорее... пока тьма не добралась и до вас.",
    code: 'X-33-Y'
  },
  koschei: {
    distress: "Холодно... слишком холодно. Время здесь будто остановилось. Дух Изнанки заточил меня в этой проклятой пещере, даже эхо здесь не слышно. Но у меня есть амулет. Старинный. Очень сильный. Он способен указать путь даже там, где не видно выхода.",
    task: "Но на нём лежит проклятье: амулет не подпускает к себе закоченелых людей. Всем надо разогреться — встаньте в круг, и пусть каждый по очереди разогревает другого участника, пока тепло не вернётся. Затем берите амулет среди теней леса и передайте мне координаты. И поторопитесь... я чувствую, как тьма надвигается и на реальный мир!",
    code: 'ZERO-0'
  },
  leshy: {
    distress: "Лес утонул под пеплом, деревья засохли, трава почернела, в воздухе висит морок! Я больше не вижу прежних тропинок. Только мой заговорённый меч способен разрубить эту тьму.",
    task: "Но есть условие: меч может взять лишь один. Завяжите смельчаку глаза, пусть остальные направляют его голосом — шаг за шагом, не касаясь руками. Отыщите древнюю реликвию и отправьте мне её координаты, пока тьма окончательно не стёрла с лица Заповедника все пути.",
    code: 'ROOT-7'
  },
  kikimora: {
    distress: "Ой, мамочки... где это я?.. Эта жуткая паутина тянется бесконечно, а злобный дух всё глубже заманивает меня в свои пучины. Только мой гребень способен распутать эти проклятые нити.",
    task: "Чтобы его отыскать, нужно сплести огромную косу из ниток. Разделитесь на три части и вместе заплетите её — только тогда гребень явится. Ищите его под корнями деревьев — там, где земля холоднее обычного. Найдёте — сразу отправляйте координаты! Пока паутина не утянула меня в самые глубины Изнанки...",
    code: 'WEB-99'
  },
  vodyanoy: {
    distress: "Буль... буль... Вода почернела, реки превратились в вязкую грязь! Мне нужен мой трезубец. Только он способен очистить эту проклятую тьму и вернуть воде чистоту.",
    task: "Но болото коварно — вам нужно по очереди пропрыгать к трезубцу по камням, стараясь не упасть. Каждый шаг на вес золота. Найдите его и передайте мне координаты. Иначе трясина поглотит меня вместе со всеми моими владениями...",
    code: 'DEEP-8'
  }
};

const arrivalProtocols = [
  { trigger: "подтверждаю прибытие", response: "Связь установлена. Слушаю..." },
  { trigger: "на связи", response: "Сигнал получен. Передаю расшифровку..." },
  { trigger: "объект найден", response: "Объект в зоне доступа. Транслирую сообщение..." },
  { trigger: "объект в зоне видимости", response: "Канал разблокирован. Говорите..." },
  { trigger: "связь установлена", response: "Помехи подавлены. Слушаю координаты..." }
];

const paths = {
  ivan: ['kikimora', 'koschei', 'yaga', 'leshy', 'vodyanoy'],
  zabava: ['vodyanoy', 'leshy', 'yaga', 'koschei', 'kikimora']
};

function startQuest(selected) {
  team = selected;
  startTime = new Date();
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  timerIdx = setInterval(() => {
    let diff = Math.floor((new Date() - startTime) / 1000);
    document.getElementById('timer').innerText = String(Math.floor(diff/60)).padStart(2,'0') + ':' + String(diff%60).padStart(2,'0');
  }, 1000);
  addMsg('СИСТЕМА', `Канал открыт. Первая цель: ${getHeroName(paths[team][0])}. По прибытии введите протокол: "${arrivalProtocols[0].trigger}".`, 'sys');
}

function getHeroName(key) {
  const names = { yaga: 'БАБА-ЯГА', koschei: 'КОЩЕЙ', leshy: 'ЛЕШИЙ', kikimora: 'КИКИМОРА', vodyanoy: 'ВОДЯНОЙ' };
  return names[key];
}

function showStep() {
  const heroKey = paths[team][step];
  const hero = heroMessages[heroKey];
  const heroName = getHeroName(heroKey);
  // Сначала сообщение о бедствии
  addMsg(heroName, hero.distress, 'hero');
  // Через небольшую паузу — задание (отдельное сообщение)
  setTimeout(() => {
    addMsg(heroName, hero.task, 'hero');
  }, 600);
}

function triggerFinal() {
  addMsg('СИСТЕМА', 'ВСЕ ГЕРОИ ОТРЯДА ВНЕ ОПАСНОСТИ.', 'sys');
  setTimeout(() => {
    addMsg('СИСТЕМА', 'ВНИМАНИЕ: Для полной очистки Заповедника ОБЪЕДИНИТЕСЬ СО ВТОРЫМ ОТРЯДОМ.', 'sys');
    addMsg('СИСТЕМА', 'Как только встретите их — подтвердите это в терминале (напишите "НАШЛИ" или "ВСТРЕТИЛИ").', 'sys');
    finalStage = 1;
  }, 1000);
}

function handleSend() {
  let input = document.getElementById('userInput');
  let val = input.value.trim().toUpperCase();
  let rawVal = input.value.trim().toLowerCase();
  if (!val) return;
  addMsg('ВЫ', input.value, 'user');
  input.value = '';

  if (finalStage === 1) {
    if (val.includes('НАШЛИ') || val.includes('ВСТРЕТИЛИ') || val.includes('ВМЕСТЕ')) {
      addMsg('СИСТЕМА', 'Визуальное подтверждение получено. Обе группы в сборе.', 'sys');
      addMsg('СИСТЕМА', 'Для окончательной победы введите финальный временной ключ (текущий год).', 'sys');
      finalStage = 2;
    } else {
      addMsg('СИСТЕМА', 'ОШИБКА. Доложите о встрече со вторым отрядом (НАШЛИ / ВСТРЕТИЛИ).', 'sys');
    }
    return;
  }
  
  if (finalStage === 2) {
    const currentYear = new Date().getFullYear().toString();
    if (val === currentYear) {
      clearInterval(timerIdx);
      document.body.classList.add('final-flash');
      addMsg('ФИНАЛ', `🕯 ИЗНАНКА СХЛОПНУЛАСЬ. Заповедник спасён! Ваше время: ${document.getElementById('timer').innerText}`, 'sys');
      addMsg('СИСТЕМА', 'Возвращайтесь в штаб к Ивану и Забаве.', 'sys');
    } else {
      addMsg('СИСТЕМА', 'КЛЮЧ НЕ ВЕРЕН. Введите текущий год.', 'sys');
    }
    return;
  }

  if (awaitingArrival) {
    if (rawVal === arrivalProtocols[step].trigger) {
      addMsg('СИСТЕМА', arrivalProtocols[step].response, 'sys');
      awaitingArrival = false;
      setTimeout(showStep, 900);
    } else {
      addMsg('СИСТЕМА', `ОШИБКА. Напишите: "${arrivalProtocols[step].trigger}"`, 'sys');
    }
    return;
  }

  const currentHeroKey = paths[team][step];
  const currentHero = heroMessages[currentHeroKey];
  if (val === currentHero.code) {
    step++;
    if (step < 5) {
      const nextHero = getHeroName(paths[team][step]);
      addMsg('СИСТЕМА', `КООРДИНАТЫ ПРИНЯТЫ. Цель: ${nextHero}. Введите протокол: "${arrivalProtocols[step].trigger}".`, 'sys');
      awaitingArrival = true;
    } else {
      triggerFinal();
    }
  } else {
    addMsg('СИСТЕМА', 'ОШИБКА. Некорректные координаты артефакта.', 'sys');
  }
}

function addMsg(who, text, type = 'bot') {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (type === 'user' ? 'user' : 'bot');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (type === 'sys' ? ' sys-msg' : '') + (type === 'hero' ? ' hero-msg' : '');
  const tag = document.createElement('span');
  tag.className = type === 'user' ? 'char-tag-user' : (type === 'sys' ? 'char-tag-sys' : 'char-tag');
  tag.textContent = who;
  const textDiv = document.createElement('div');
  bubble.appendChild(tag);
  bubble.appendChild(textDiv);
  div.appendChild(bubble);
  wrap.appendChild(div);
  
  if (type !== 'user') {
    let i = 0;
    textDiv.classList.add('typing-cursor');
    const interval = setInterval(() => {
      textDiv.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        textDiv.classList.remove('typing-cursor');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }, 18);
  } else {
    textDiv.textContent = text;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
}

document.getElementById('userInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') handleSend();
});
</script>
